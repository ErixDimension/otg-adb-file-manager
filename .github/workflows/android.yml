name: SYSrescue Android Build

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK with auto diagnostics
        shell: bash
        run: |
          set +e
          gradle assembleDebug --stacktrace --warning-mode all 2>&1 | tee build.log
          BUILD_STATUS=${PIPESTATUS[0]}

          echo
          echo "========== AUTO DEBUG =========="
          if [ "$BUILD_STATUS" -eq 0 ]; then
            echo "BUILD OK: APK berhasil dibuat."
          else
            echo "BUILD ERROR: Gradle gagal dengan kode $BUILD_STATUS."
            echo
            echo "--- ERROR UTAMA ---"
            grep -niE 'What went wrong:|Execution failed|Could not resolve|Could not find|Unresolved reference|e: file:|error:|Caused by:|FAILURE: Build failed' build.log | tail -n 40 || true
            echo
            echo "--- 100 BARIS LOG TERAKHIR ---"
            tail -n 100 build.log
            echo
            echo "--- PETUNJUK ---"
            if grep -qiE 'Could not resolve|Could not find|UnknownHostException|timed out' build.log; then
              echo "Periksa repository Maven, nama dependensi, versi, dan koneksi jaringan."
            elif grep -qiE 'Unresolved reference|e: file:|Compilation error' build.log; then
              echo "Periksa error Kotlin, import, nama API, dan versi library."
            elif grep -qiE 'SDK location not found|Failed to find target|Android SDK' build.log; then
              echo "Periksa konfigurasi Android SDK dan paket platform."
            elif grep -qiE 'requires.*JDK|Unsupported class file|incompatible' build.log; then
              echo "Periksa kompatibilitas Java, Gradle, plugin Android, dan dependensi."
            else
              echo "Gunakan bagian ERROR UTAMA dan log lengkap untuk menentukan perbaikan."
            fi
          fi

          echo "================================"
          exit "$BUILD_STATUS"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SYSrescue-build-diagnostics
          path: build.log
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SYSrescue-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
